name: Sync with upstream oh-my-pi

on:
  schedule:
    # 毎週月曜 09:00 JST (00:00 UTC) に自動実行
    - cron: '0 0 * * 1'
  workflow_dispatch: # 手動実行も可能

jobs:
  sync:
    name: Sync fork with can1357/oh-my-pi
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout omp-mc
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/can1357/oh-my-pi.git || true
          git fetch upstream

      - name: Merge upstream/main (ours wins on conflict)
        run: |
          git merge upstream/main \
            --no-edit \
            --strategy-option=ours \
            -m "chore: sync with upstream oh-my-pi"

      - name: Push to origin
        run: git push origin main
