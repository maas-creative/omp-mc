# -- omp-mc audit profiles -------------------------------------------------
# Profiles define which checks run and how failures are treated.
#
# Usage:
#   1. Place this file at .omp/audit-profile.yaml in a target project.
#   2. Select with OMP_AUDIT_PROFILE env or package.json `omp.auditProfile`.
#   3. `bun run audit` picks it up automatically.
#
# Check modes:
#   required  … must have an artifact AND pass (exit 0).  Fail blocks completion.
#   warn      … run if artifact present.  Failure logged, not a blocker.
#   off       … never run.
#   auto      … run if artifact present, treat as required.
#
# Stryker (mutation testing) is OFF by default because it is slow even on
# small projects.  Use the `full` profile for CI or overnight runs, or
# `weekly` and a cron job to run `OMP_AUDIT_PROFILE=weekly bun run audit`.
# --------------------------------------------------------------------------

profiles:
  # Default — every commit.  Fast checks only.
  default:
    gherkin:      auto
    architecture: auto
    openapi:      auto
    mutation:     off
    security:     required

  # Full — CI / pre-release.  Includes mutation testing.
  full:
    gherkin:      required
    architecture: required
    openapi:      auto
    mutation:     required
    security:     required

  # Weekly — overnight scheduled run.  Same as full but mutation is warn.
  weekly:
    gherkin:      required
    architecture: required
    openapi:      auto
    mutation:     warn
    security:     required

  # API-first project — OpenAPI + Gherkin are hard requirements.
  api:
    gherkin:      required
    architecture: warn
    openapi:      required
    mutation:     off
    security:     required

  # Library / shared code — architecture is the primary concern.
  library:
    gherkin:      auto
    architecture: required
    openapi:      off
    mutation:     off
    security:     required
